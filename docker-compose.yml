# Déploiement Dokploy : aucun port publié sur l'hôte, Traefik joint `payload` sur le port 3000
# (domaine à configurer dans Dokploy). Variables à renseigner dans l'onglet Environment.

services:
  payload:
    build: .
    restart: unless-stopped
    expose:
      - '3000'
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-payload}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}@postgres:5432/${POSTGRES_DB:-portfolio}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?PAYLOAD_SECRET manquant}
      CONTACT_NOTIFICATION_EMAIL: ${CONTACT_NOTIFICATION_EMAIL:-}
      UMAMI_SCRIPT_URL: ${UMAMI_SCRIPT_URL:-}
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
      SEED_ON_INIT: ${SEED_ON_INIT:-true}
    volumes:
      - media:/app/media
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    expose:
      - '5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-payload}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  media:
